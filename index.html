<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>짤·카드 스튜디오</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main>
        <h1>짤·카드 스튜디오</h1>
        <p>이미지와 문구를 조합해 나만의 카드를 만들어 보세요.</p>

        <section>
            <h2>이미지 편집</h2>

            <label for="imageInput">이미지 선택 (PNG, JPEG)</label>
            <input type="file" id="imageInput" accept=".png,.jpg,.jpeg,image/png,image/jpeg">
            <p id="fileMessage" role="status"></p>

            <label for="backgroundMode">배경 설정</label>
            <select id="backgroundMode">
                <option value="transparent">투명 배경</option>
                <option value="color">색상 배경</option>
            </select>

            <label for="backgroundColor">배경 색상</label>
            <input type="color" id="backgroundColor" value="#ffffff">

            <label for="imageFit">이미지 배치 방식</label>
            <select id="imageFit">
                <option value="contain">원본 맞춤 (잘림 없음)</option>
                <option value="cover">화면 채우기 (일부 잘림 가능)</option>
            </select>

            <label for="imageScale">이미지 크기: <span id="scaleValue">100%</span></label>
            <input type="range" id="imageScale" min="50" max="200" value="100" step="5">

        </section> <!-- 이미지 편집 영역 닫기 -->


        <section>
            <h2>문구 편집</h2>

            <label for="textInput">문구</label>
            <textarea id="textInput">오늘도 좋은 하루!</textarea>

            <label for="textSize">
                글자 크기: <span id="textSizeValue">36px</span>
            </label>
            <input type="range" id="textSize" min="16" max="80" value="36">


            <label for="textColor">글자 색상</label>
            <input type="color" id="textColor" value="#ffffff">

            <label for="textX">
                가로 위치: <span id="textXValue">50%</span>
            </label>
            <input type="range" id="textX" min="0" max="100" value="50">

            <label for="textY">
                세로 위치: <span id="textYValue">50%</span>
            </label>
            <input type="range" id="textY" min="0" max="100" value="50">

        </section>


        <section>
            <h2>미리보기</h2>

            <label for="aspectRatio">화면 비율</label>
            <select id="aspectRatio">
                <option value="1:1">1:1 — 정사각형</option>
                <option value="4:5">4:5 — 세로형 카드</option>
                <option value="9:16">9:16 — 스토리형</option>
            </select>

            <canvas id="previewCanvas" width="600" height="600"></canvas>
            <button type="button" id="downloadBtn">
                PNG 다운로드
            </button>
        </section>

        <section id="templateSection">
            <h2>템플릿 관리</h2>

            <label for="templateName">템플릿 이름</label>
            <input type="text" id="templateName" placeholder="예: 분홍색 SNS 카드">

            <button type="button" id="saveTemplateBtn">
                새 템플릿 저장
            </button>

            <label for="templateSelect">저장된 템플릿</label>
            <select id="templateSelect">
                <option value="">템플릿을 선택하세요</option>
            </select>

            <button type="button" id="loadTemplateBtn">
                불러오기
            </button>

            <button type="button" id="updateTemplateBtn">
                수정 내용 저장
            </button>

            <button type="button" id="deleteTemplateBtn">
                삭제
            </button>

            <p id="templateMessage" role="status"></p>
        </section>

        <!-- 카드 5 — JSON 백업 및 복원 -->
        <section id="backupSection">
            <h2>템플릿 백업 및 복원</h2>

            <p>
                저장된 템플릿을 JSON 파일로 백업하거나
                백업 파일에서 다시 복원할 수 있습니다.
            </p>

            <button type="button" id="exportJsonBtn">
                JSON 백업 다운로드
            </button>

            <label for="importJsonInput">
                JSON 백업 파일 선택
            </label>

            <input type="file" id="importJsonInput" accept=".json,application/json">

            <button type="button" id="importJsonBtn">
                JSON 복원하기
            </button>

            <p id="backupMessage" role="status"></p>
        </section>

    </main>
</body>

</html>
